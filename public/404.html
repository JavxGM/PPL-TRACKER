<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>PPL Tracker</title>
    <script>
      // SPA para GitHub Pages — redirige rutas desconocidas al index codificando
      // el path como query string para que el service worker / index.html lo restaure.
      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 2).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(1).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
